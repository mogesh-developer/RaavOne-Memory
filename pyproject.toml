[tool.poetry]
name = "raavone-memory"
version = "1.0.0"
description = "Personal assistant memory service backend using FastAPI"
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "app" },
    { include = "raavone_core" }
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
sqlalchemy = "^2.0.0"
pydantic = "^2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
